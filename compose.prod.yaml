# Ambiente de produção (single host) — TD-07.5. Uso:
#   cp .env.production.example .env.production && edite os segredos
#   docker compose -f compose.prod.yaml --env-file .env.production up -d --build
# Um reverse proxy externo (nginx/traefik/caddy) deve terminar TLS e expor apenas o frontend (3001)
# e o storage (9000) — a API só é alcançada pelo frontend (BFF) e pelo worker.
name: streamtube-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"   # URLs pré-assinadas (S3_PUBLIC_ENDPOINT) — atrás do proxy TLS
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET} && exit 0"

  api:
    build:
      context: ./nestjs-project
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DB_HOST: db
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    # aplica migrations antes de subir (idempotente)
    command: ["sh", "-c", "npx typeorm -d dist/database/data-source.js migration:run && node dist/main"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    stop_grace_period: 2m
    env_file: .env.production
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_LOCK_DURATION_MS: ${WORKER_LOCK_DURATION_MS:-300000}
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./next-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      SESSION_PASSWORD: ${SESSION_PASSWORD}
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  minio_data:
