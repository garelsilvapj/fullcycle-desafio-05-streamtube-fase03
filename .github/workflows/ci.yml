name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # API NestJS: typecheck, build, lint (incluindo specs), unit + integração + e2e
  # contra Postgres/Redis/MinIO/Mailpit reais, e verificação de frescor do openapi.json.
  # ---------------------------------------------------------------------------
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nestjs-project
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: streamtube
          POSTGRES_PASSWORD: streamtube
          POSTGRES_DB: streamtube
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U streamtube"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: nestjs-project/package-lock.json

      # MinIO precisa do comando `server /data`, que service containers não permitem.
      - name: Subir MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing local/streamtube-videos"

      - name: Gerar .env (hosts do runner)
        run: |
          sed -e 's/^DB_HOST=.*/DB_HOST=localhost/' \
              -e 's/^MAIL_HOST=.*/MAIL_HOST=localhost/' \
              -e 's#^S3_ENDPOINT=.*#S3_ENDPOINT=http://localhost:9000#' \
              -e 's/^REDIS_HOST=.*/REDIS_HOST=localhost/' \
              .env.example > .env

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Lint (fonte + testes, sem --fix)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - name: Prettier
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - name: Migrations
        run: npm run migration:run
      - name: Testes unitários + integração
        run: npx jest --runInBand
      - name: Testes e2e
        run: npm run test:e2e
      - name: OpenAPI está atualizado no repositório
        run: |
          npm run openapi:export
          git diff --exit-code -- openapi.json || {
            echo "::error::openapi.json desatualizado — rode 'npm run openapi:export' e commite."; exit 1; }

  # ---------------------------------------------------------------------------
  # Worker de vídeo: typecheck, build, testes (incluindo FFmpeg real) na imagem Docker.
  # ---------------------------------------------------------------------------
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Testes (imagem com FFmpeg)
        run: |
          docker build --target test -t streamtube-worker-test .
          docker run --rm streamtube-worker-test
      - name: Imagem de runtime constrói
        run: docker build --target runtime -t streamtube-worker .

  # ---------------------------------------------------------------------------
  # Frontend Next.js: typecheck, lint, unit + integração (Vitest + MSW).
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-frontend
    env:
      API_URL: http://localhost:3000
      SESSION_PASSWORD: ci-session-password-with-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: next-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Testes (Vitest + MSW)
        run: npm test
